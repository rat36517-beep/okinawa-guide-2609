<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>나하에서 얀바루까지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700,800&family=Shippori+Mincho:wght@600,700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
:root{
  --ground:#FAF7F0; --surface:#FFFFFF; --surface-2:#F1EDE4;
  --ink:#123B4F; --text:#22333C; --muted:#6B7C86;
  --sea:#1B7F8C; --sea-soft:#DCEDEC; --kawara:#C4562F; --kawara-soft:#F6E4DC;
  --line:#E3DCCF; --shadow:0 1px 2px rgba(18,59,79,.06),0 8px 24px rgba(18,59,79,.06);
  --radius:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E1A20; --surface:#17262E; --surface-2:#1F313A;
  --ink:#CFE6E4; --text:#E2EBED; --muted:#8FA5AF;
  --sea:#5CC2C0; --sea-soft:#17383C; --kawara:#E58256; --kawara-soft:#3A2419;
  --line:#283D47; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
}}
:root[data-theme="dark"]{
  --ground:#0E1A20; --surface:#17262E; --surface-2:#1F313A;
  --ink:#CFE6E4; --text:#E2EBED; --muted:#8FA5AF;
  --sea:#5CC2C0; --sea-soft:#17383C; --kawara:#E58256; --kawara-soft:#3A2419;
  --line:#283D47; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--text);
  font-family:"Noto Sans KR","Noto Sans JP",system-ui,sans-serif;
  font-size:15px; line-height:1.65; word-break:keep-all;
}
h1,h2,.disp{font-family:"Nanum Myeongjo","Shippori Mincho",serif; font-weight:800; text-wrap:balance}
a{color:var(--sea)}
.wrap{max-width:1120px; margin:0 auto; padding-inline:16px}

header{padding-block:34px 18px; border-bottom:1px solid var(--line)}
h1{margin:0; color:var(--ink); font-size:clamp(28px,6vw,44px); letter-spacing:-.01em}
.sub{margin:8px 0 0; color:var(--muted); font-size:14px}
.legend{display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:16px; font-size:12.5px; color:var(--muted)}
.legend b{color:var(--text); font-weight:500}

.bar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--ground);
  background:color-mix(in srgb,var(--ground) 92%,transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  padding-block:10px;
}
.row{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
/* 폰에서는 칩이 여러 줄로 쌓여 화면 절반을 먹는다. 가로 스크롤로 한 줄에 둔다 */
@media (max-width:600px){
  .row.scroll{flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; padding-bottom:2px}
  .row.scroll::-webkit-scrollbar{display:none}
  .row.scroll .chip{flex:0 0 auto}
  .row.scroll .lbl{position:sticky; left:0; background:var(--ground); padding-right:4px; z-index:1}
  /* 검색 행이 두 줄로 접히면 고정바가 화면 절반을 먹는다. 한 줄로 민다 */
  .row.find{flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none}
  .row.find::-webkit-scrollbar{display:none}
  .row.find>*{flex:0 0 auto}
  .row.find input[type="search"]{flex:0 0 150px; width:150px}
  .row.find .count{margin-left:4px}
}
/* 일정 탭에서는 필터가 아무 일도 안 한다. 접어서 화면을 돌려준다 */
.bar.tabsonly .row{display:none}
.row+.row{margin-top:7px}
.lbl{font-size:11px; letter-spacing:.09em; color:var(--muted); min-width:34px}
button{font:inherit; cursor:pointer}
.chip{
  border:1px solid var(--line); background:var(--surface); color:var(--text);
  padding:5px 11px; border-radius:999px; font-size:13px; line-height:1.3;
  transition:background .12s,border-color .12s,color .12s;
}
.chip:hover{border-color:var(--sea)}
.chip[aria-pressed="true"]{background:var(--sea); border-color:var(--sea); color:#fff}
.chip.warm[aria-pressed="true"]{background:var(--kawara); border-color:var(--kawara)}
input[type="search"]{
  font:inherit; flex:1 1 160px; min-width:0; padding:6px 12px; border-radius:999px;
  border:1px solid var(--line); background:var(--surface); color:var(--text);
}
input[type="search"]:focus-visible,.chip:focus-visible,a:focus-visible{outline:2px solid var(--sea); outline-offset:2px}
.count{font-size:13px; color:var(--muted); margin-left:auto; font-variant-numeric:tabular-nums}

.tabs{display:flex; gap:4px; margin-bottom:9px}
.tab{
  border:1px solid var(--line); background:var(--surface); color:var(--muted);
  padding:5px 16px; border-radius:999px; font-size:13.5px; font-weight:500;
}
.tab[aria-selected="true"]{background:var(--ink); border-color:var(--ink); color:var(--ground)}

main{padding-block:18px 60px}
.mapwrap{
  position:relative;                     /* 팝업 기준. 팝업이 잘리면 안 되므로 overflow 는 두지 않는다 */
  max-width:560px; margin:0 auto; background:var(--sea-soft);
  border:1px solid var(--line); border-radius:var(--radius);
}
svg.map{display:block; width:100%; height:auto; touch-action:manipulation; border-radius:inherit}

.pop{
  position:absolute; z-index:6; width:min(230px,66vw);
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  box-shadow:0 6px 24px rgba(10,25,32,.22); padding:9px;
  transform:translate(-50%,-100%); margin-top:-14px;
  display:flex; flex-direction:column; gap:6px;
}
.pop::after{                             /* 점을 가리키는 꼬리 */
  content:""; position:absolute; left:50%; bottom:-7px; width:12px; height:12px;
  background:var(--surface); border-right:1px solid var(--line); border-bottom:1px solid var(--line);
  transform:translateX(-50%) rotate(45deg);
}
.pop.below::after{                       /* 위가 모자라 아래로 뒤집혔을 때 */
  bottom:auto; top:-7px;
  border:0; border-left:1px solid var(--line); border-top:1px solid var(--line);
}
.pop img{width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:7px; display:block}
.pop .pn{
  margin:0; font-family:"Nanum Myeongjo","Shippori Mincho",serif; font-weight:700;
  font-size:14.5px; color:var(--ink); line-height:1.35;
}
.pop .pm{margin:0; font-size:11.5px; color:var(--muted)}
.pop .pr{display:flex; gap:6px}
.pop .pr>*{flex:1; font-size:11.5px; padding:5px 0; text-align:center; border-radius:7px}
.pop .x{
  position:absolute; right:5px; top:5px; width:22px; height:22px; border-radius:99px;
  border:0; background:rgba(0,0,0,.45); color:#fff; font-size:13px; line-height:1;
  display:grid; place-items:center; padding:0; z-index:1;
}
svg.map .land{fill:var(--surface); stroke:var(--line); stroke-width:1.5}
svg.map .dot{fill:var(--sea); stroke:var(--surface); stroke-width:1.5; cursor:pointer}
svg.map .dot.pick{fill:var(--kawara)}
svg.map .hit{fill:transparent; cursor:pointer}
svg.map .anch{fill:var(--surface); stroke:var(--ink); stroke-width:3}
svg.map .anchlbl{
  fill:var(--ink); font-size:19px; font-family:"Noto Sans KR",sans-serif; font-weight:700;
  /* 장소 점 위에 얹히므로 바탕색 테두리를 둘러 글자가 묻히지 않게 한다 */
  paint-order:stroke; stroke:var(--surface); stroke-width:5px; stroke-linejoin:round;
}
.maplegend{
  display:flex; flex-wrap:wrap; gap:6px 16px; justify-content:center;
  margin:12px auto 0; max-width:560px; font-size:12.5px; color:var(--muted);
}
.maplegend i{width:9px; height:9px; border-radius:99px; display:inline-block; margin-right:5px}
.mapinfo{
  max-width:560px; margin:14px auto 0; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow);
}
.mapinfo .nm{margin:0 0 2px}
.mapinfo .row2{display:flex; gap:8px; align-items:center; margin-top:10px}
.mapinfo .row2 a{flex:1; text-align:center}
.mapnote{max-width:560px; margin:10px auto 0; font-size:12px; color:var(--muted); text-align:center}

.days{display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:18px}
.day{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:16px 17px; display:flex; flex-direction:column; gap:11px;
}
.day .hd{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap}
.day .dt{
  font-family:"Nanum Myeongjo","Shippori Mincho",serif; font-weight:800;
  font-size:24px; color:var(--ink); line-height:1;
}
.day .wd{font-size:13px; color:var(--muted)}
.day .base{margin-left:auto; font-size:12px; color:var(--sea); font-weight:500}
.day .who{margin:0; font-size:12.5px; color:var(--muted)}
.tl{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px}
.tl li{display:flex; gap:11px; font-size:13.5px; align-items:baseline}
.tl b{
  flex:0 0 46px; font-weight:500; color:var(--sea); font-size:12.5px;
  font-variant-numeric:tabular-nums;
}
.warnbox{
  background:var(--kawara-soft); color:var(--kawara); border-radius:9px;
  padding:9px 11px; font-size:12.5px; line-height:1.55;
}
.warnbox b{display:block; font-weight:700; margin-bottom:2px}
.tipbox{font-size:12.5px; color:var(--muted); border-left:2px solid var(--line); padding-left:10px}
.day .go{margin-top:2px}

h2.sec{
  margin:26px 0 13px; font-size:20px; color:var(--ink);
  padding-bottom:7px; border-bottom:1px solid var(--line);
}
h2.sec:first-child{margin-top:4px}
.day.dim{opacity:.62}
.day .badge{
  flex:0 0 auto; background:var(--sea); color:#fff; border-radius:7px;
  padding:2px 9px; font-size:13px; font-weight:700; font-family:"Noto Sans KR",sans-serif;
}
.day.dim .badge{background:var(--muted)}
.day .hot{background:var(--kawara)}
.gain{
  background:var(--sea-soft); color:var(--sea); border-radius:9px;
  padding:9px 11px; font-size:14px; font-weight:700;
}
.kv{margin:0; font-size:13px; display:flex; gap:8px}
.kv b{flex:0 0 38px; font-weight:500; color:var(--muted); font-size:12px}
.secnote{margin:-6px 0 13px; font-size:13px; color:var(--muted)}
.day.info{gap:6px; padding:14px 15px}
.day.info .nm{font-size:15.5px}
.day.info .desc{font-size:13.5px}
.day.danger{border-color:var(--kawara); background:var(--kawara-soft)}
.day.danger .nm, .day.danger .desc{color:var(--kawara)}
.star{color:var(--kawara)}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:18px}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column;
}
.ph{aspect-ratio:4/3; background:var(--surface-2); position:relative; overflow:hidden}
.ph img{width:100%; height:100%; object-fit:cover; display:block}
.ph .none{
  position:absolute; inset:0; display:grid; place-items:center;
  color:var(--muted); font-size:12px; letter-spacing:.08em;
}
.shots{
  position:absolute; left:0; right:0; bottom:7px; display:flex; gap:5px; justify-content:center;
  pointer-events:none;
}
.shots span{
  width:5px; height:5px; border-radius:99px; background:rgba(255,255,255,.55);
  box-shadow:0 0 3px rgba(0,0,0,.4);
}
.shots span.on{background:#fff; width:14px}
.fav{
  position:absolute; right:8px; top:8px; width:34px; height:34px; border-radius:999px;
  border:0; background:rgba(255,255,255,.88); color:#9AA7AD; font-size:16px; line-height:1;
  display:grid; place-items:center; box-shadow:0 2px 8px rgba(0,0,0,.18);
}
.fav[aria-pressed="true"]{background:var(--kawara); color:#fff}
.body{padding:13px 14px 14px; display:flex; flex-direction:column; gap:7px; flex:1}
.nm{margin:0; font-size:17px; color:var(--ink); font-family:"Nanum Myeongjo","Shippori Mincho",serif; font-weight:700; line-height:1.35}
.ja{font-family:"Noto Sans JP",sans-serif; font-size:12.5px; color:var(--muted); margin:-4px 0 0}
.tags{display:flex; flex-wrap:wrap; gap:5px}
.tag{font-size:11px; padding:2px 8px; border-radius:999px; background:var(--sea-soft); color:var(--sea)}
.tag.kr{background:var(--kawara-soft); color:var(--kawara)}
.tag.plain{background:var(--surface-2); color:var(--muted)}
.desc{margin:0; font-size:13.5px; color:var(--text)}
.meta{margin:0; font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:2px}
.meta .warn{color:var(--kawara)}
.go{
  margin-top:auto; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  text-decoration:none; padding:8px; border-radius:9px; font-size:13px; font-weight:500;
  background:var(--sea-soft); color:var(--sea); border:1px solid transparent;
}
.go:hover{border-color:var(--sea)}
.empty{padding:60px 0; text-align:center; color:var(--muted)}

dialog{
  border:1px solid var(--line); border-radius:var(--radius); background:var(--surface);
  color:var(--text); padding:18px; max-width:min(560px,92vw); box-shadow:var(--shadow);
}
dialog::backdrop{background:rgba(10,25,32,.5)}
dialog h2{margin:0 0 10px; font-size:19px; color:var(--ink)}
dialog textarea{
  width:100%; height:38vh; font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
  border:1px solid var(--line); border-radius:9px; padding:10px; resize:vertical;
  background:var(--ground); color:var(--text);
}
.dlg-row{display:flex; gap:8px; justify-content:flex-end; margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>나하에서 얀바루까지</h1>
    <p class="sub">2026년 9월 23–27일 · 오키나와 본섬 323곳. 정해진 일정이 아니라 고르는 목록이다. 마음에 드는 곳에 ♥ 를 누르고, 맨 위 <b>고른 곳 내보내기</b>로 가족에게 보내면 된다.</p>
    <div class="legend">
      <span><b>현지</b> 일본 현지인 입소문</span>
      <span><b>한국</b> 한국 여행자에게 알려진 곳</span>
      <span><b>휴무·매진 정보는 방문 전날 다시 확인할 것</b></span>
    </div>
  </header>
</div>

<div class="bar">
  <div class="wrap">
    <div class="tabs" role="tablist">
      <button class="tab" id="tabList" role="tab" aria-selected="true">목록</button>
      <button class="tab" id="tabMap" role="tab" aria-selected="false">지도</button>
      <button class="tab" id="tabItin" role="tab" aria-selected="false">일정</button>
      <button class="tab" id="tabDeal" role="tab" aria-selected="false">쿠폰·축제</button>
      <button class="tab" id="tabInfo" role="tab" aria-selected="false">여행정보</button>
    </div>
    <div class="row scroll" id="areaRow"><span class="lbl">지역</span></div>
    <div class="row scroll" id="catRow"><span class="lbl">분류</span></div>
    <div class="row find">
      <span class="lbl">찾기</span>
      <input type="search" id="q" placeholder="이름·설명으로 검색 (예: 소바, 젠자이, 바다)">
      <button class="chip warm" id="favOnly" aria-pressed="false">♥ 고른 곳만</button>
      <button class="chip" id="exportBtn">고른 곳 내보내기</button>
      <button class="chip" id="reset">초기화</button>
      <span class="count" id="count"></span>
    </div>
  </div>
</div>

<main class="wrap">
  <div id="listPane">
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>조건에 맞는 곳이 없다. 필터를 줄여보자.</p>
  </div>

  <div id="mapPane" hidden>
    <div class="mapwrap" id="mapwrap"><svg class="map" id="svg" role="img" aria-label="오키나와 본섬 장소 분포도"></svg></div>
    <div class="maplegend">
      <span><i style="background:var(--sea)"></i>장소</span>
      <span><i style="background:var(--kawara)"></i>내가 담은 곳</span>
      <span>◇ 숙소·공항</span>
    </div>
    <div class="mapinfo" id="mapinfo" hidden></div>
    <p class="mapnote" id="mapnote"></p>
  </div>

  <div id="itinPane" hidden>
    <div class="days" id="days"></div>
  </div>

  <div id="dealPane" hidden>
    <h2 class="sec">갈 수 있는 축제</h2>
    <div class="days" id="festGo"></div>
    <h2 class="sec">쿠폰·할인</h2>
    <div class="days" id="deals"></div>
    <h2 class="sec">일정상 못 가는 축제</h2>
    <div class="days" id="festNo"></div>
  </div>

  <div id="infoPane" hidden></div>
</main>

<dialog id="dlg">
  <h2>고른 곳</h2>
  <textarea id="dlgText" readonly></textarea>
  <div class="dlg-row">
    <button class="chip" id="copyBtn">복사</button>
    <button class="chip" id="closeBtn">닫기</button>
  </div>
</dialog>

<script>

const KEY = "okinawa-picks-v1";

const store = {
  get(){ try{ return new Set(JSON.parse(localStorage.getItem(KEY)||"[]")); }catch(e){ return new Set(); } },
  set(s){ try{ localStorage.setItem(KEY, JSON.stringify([...s])); }catch(e){} }
};
let picks = store.get();
const state = { area:new Set(), cat:new Set(), aud:new Set(), q:"", favOnly:false };

function chip(text, on, cls){
  const b = document.createElement("button");
  b.className = "chip" + (cls ? " "+cls : "");
  b.textContent = text;
  b.setAttribute("aria-pressed","false");
  b.addEventListener("click", () => {
    const next = b.getAttribute("aria-pressed") !== "true";
    b.setAttribute("aria-pressed", String(next));
    on(next);
    render();
  });
  return b;
}
function toggler(set, val){ return on => { on ? set.add(val) : set.delete(val); }; }

const areaRow = document.getElementById("areaRow");
AREAS.forEach(a => areaRow.append(chip(a, toggler(state.area, a))));
const catRow = document.getElementById("catRow");
CATS.forEach(c => catRow.append(chip(c, toggler(state.cat, c))));
catRow.append(chip("현지", toggler(state.aud, "jp_local"), "warm"));
catRow.append(chip("한국", toggler(state.aud, "kr_popular"), "warm"));

document.getElementById("q").addEventListener("input", e => { state.q = e.target.value.trim(); render(); });
const favBtn = document.getElementById("favOnly");
favBtn.addEventListener("click", () => {
  state.favOnly = favBtn.getAttribute("aria-pressed") !== "true";
  favBtn.setAttribute("aria-pressed", String(state.favOnly));
  render();
});
document.getElementById("reset").addEventListener("click", () => {
  state.area.clear(); state.cat.clear(); state.aud.clear();
  state.q = ""; state.favOnly = false;
  document.getElementById("q").value = "";
  document.querySelectorAll(".bar .chip").forEach(b => b.setAttribute("aria-pressed","false"));
  render();
});

function match(p){
  if (state.area.size && !state.area.has(p.a)) return false;
  if (state.cat.size && !state.cat.has(p.c)) return false;
  if (state.aud.size && ![...state.aud].some(a => (p.au||[]).includes(a))) return false;
  if (state.favOnly && !picks.has(p.id)) return false;
  if (state.q){
    const hay = [p.n,p.j,p.d,p.s,p.c,p.t,p.h,p.x].join(" ").toLowerCase();
    if (!hay.includes(state.q.toLowerCase())) return false;
  }
  return true;
}

const grid = document.getElementById("grid");
const empty = document.getElementById("empty");
const countEl = document.getElementById("count");

const io = ("IntersectionObserver" in window) ? new IntersectionObserver(entries => {
  for (const e of entries){
    if (!e.isIntersecting) continue;
    if (e.target._src) e.target.src = e.target._src;
    io.unobserve(e.target);
  }
}, { rootMargin: "500px" }) : null;

  add(p.c);

    const m = document.createElement("p");
    m.className = "meta";
    if (p.h){ const s=document.createElement("span"); s.textContent="영업 "+p.h; m.append(s); }
    if (p.x){ const s=document.createElement("span"); s.className="warn"; s.textContent="휴무 "+p.x; m.append(s); }
    if (p.pk){ const s=document.createElement("span"); s.textContent="주차 "+p.pk; m.append(s); }
    body.append(m);
  }

  const go = document.createElement("a");
  go.className = "go"; go.href = p.u; go.target = "_blank"; go.rel = "noopener";
  go.textContent = "구글 지도에서 열기";
  body.append(go);

  el.append(ph, body);
  return el;
}

function updateCount(){
  const shown = grid.childElementCount;
  countEl.textContent = `${shown}곳 표시 · ♥ ${picks.size}`;
}

function render(){
  const list = PLACES.filter(match);
  grid.replaceChildren(...list.map(card));
  empty.hidden = list.length > 0;
  updateCount();
  if (!mapPane.hidden) drawDots();
}

/* ---- 지도 ---- */
const SVGNS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("svg");
const mapinfo = document.getElementById("mapinfo");
const mapnote = document.getElementById("mapnote");
let dotLayer = null;

function project(lat, lng){
  return [ (lng - PROJ.lon0) * PROJ.kx * PROJ.scale, (PROJ.lat1 - lat) * PROJ.scale ];
}
function el(name, attrs){
  const n = document.createElementNS(SVGNS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}
// 같은 동네로 지오코딩된 곳들이 한 점에 겹치지 않게 id 기준으로 일정하게 흩는다
function jitter(id){
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) | 0;
  const a = (h % 360) * Math.PI / 180, r = 4 + (Math.abs(h >> 9) % 7);
  return [Math.cos(a) * r, Math.sin(a) * r];
}

function initMap(){
  svg.setAttribute("viewBox", `0 0 ${PROJ.w} ${PROJ.h}`);
  const land = el("g", {});
  COAST.forEach(d => land.append(el("path", { d, class: "land" })));
  svg.append(land);

  const anch = el("g", {});
  ANCHORS.forEach(a => {
    const [x, y] = project(a.lat, a.lng);
    anch.append(el("path", { class: "anch", d: `M${x},${y-9}L${x+9},${y}L${x},${y+9}L${x-9},${y}Z` }));
    const t = el("text", { class: "anchlbl", x: x + 14, y: y + 6 });
    t.textContent = a.n;
    anch.append(t);
  });
  svg.append(anch);

  dotLayer = el("g", {});
  svg.append(dotLayer);
  svg.append(anch);   // 기준점이 장소 점에 가리지 않도록 맨 위로
}

const mapwrap = document.getElementById("mapwrap");
let pop = null;

function closePop(){
  if (pop){ pop.remove(); pop = null; }
}

/* SVG 좌표 → 컨테이너 픽셀. 반응형이라 렌더된 크기로 매번 환산한다 */
function toPx(x, y){
  const r = svg.getBoundingClientRect(), w = mapwrap.getBoundingClientRect();
  return [ x / PROJ.w * r.width + (r.left - w.left),
           y / PROJ.h * r.height + (r.top - w.top) ];
}

function showPop(p, sx, sy, dot){
  closePop();
  const [px, py] = toPx(sx, sy);
  pop = document.createElement("div");
  pop.className = "pop";

  const x = document.createElement("button");
  x.className = "x"; x.type = "button"; x.textContent = "×";
  x.setAttribute("aria-label", "닫기");
  x.addEventListener("click", e => { e.stopPropagation(); closePop(); });
  pop.append(x);

  if (p.im && p.im.length){
    const img = document.createElement("img");
    img.src = p.im[0]; img.alt = p.n; img.decoding = "async";
    pop.append(img);
  }
  const nm = document.createElement("p");
  nm.className = "pn"; nm.textContent = p.n;
  const mt = document.createElement("p");
  mt.className = "pm"; mt.textContent = [p.c, p.s || p.a].filter(Boolean).join(" · ");
  pop.append(nm, mt);
  if (p.x){
    const w = document.createElement("p");
    w.className = "pm"; w.style.color = "var(--kawara)";
    w.textContent = "휴무 " + p.x;
    pop.append(w);
  }

  const row = document.createElement("div");
  row.className = "pr";
  const fav = document.createElement("button");
  fav.className = "chip warm";
  const label = () => picks.has(p.id) ? "♥ 담김" : "♥ 담기";
  fav.textContent = label();
  fav.setAttribute("aria-pressed", String(picks.has(p.id)));
  fav.addEventListener("click", e => {
    e.stopPropagation();
    picks.has(p.id) ? picks.delete(p.id) : picks.add(p.id);
    store.set(picks);
    fav.textContent = label();
    fav.setAttribute("aria-pressed", String(picks.has(p.id)));
    // 전체를 다시 그리면 팝업이 닫히므로 누른 점만 색을 바꾼다
    if (dot) dot.classList.toggle("pick", picks.has(p.id));
    updateCount();
  });
  const go = document.createElement("a");
  go.className = "go"; go.href = p.u; go.target = "_blank"; go.rel = "noopener";
  go.textContent = "지도";
  row.append(fav, go);
  pop.append(row);

  mapwrap.append(pop);
  // 화면 밖으로 나가지 않게 좌우를 물리고, 위가 모자라면 점 아래로 뒤집는다
  const pw = pop.offsetWidth, ph = pop.offsetHeight, ww = mapwrap.clientWidth;
  const left = Math.min(Math.max(px, pw / 2 + 4), ww - pw / 2 - 4);
  pop.style.left = left + "px";
  if (py - ph - 14 < 0){
    pop.style.top = (py + 16) + "px";
    pop.style.transform = "translate(-50%,0)";
    pop.style.marginTop = "0";
    pop.classList.add("below");
  } else {
    pop.style.top = py + "px";
  }
}

function showInfo(p){
  mapinfo.hidden = false;
  mapinfo.replaceChildren();
  const h = document.createElement("h3");
  h.className = "nm"; h.textContent = p.n;
  const ja = document.createElement("p");
  ja.className = "ja"; ja.textContent = p.j || "";
  const tags = document.createElement("div");
  tags.className = "tags";
  [[p.c, ""], [[p.a, p.s].filter(Boolean).join(" · "), "plain"]].forEach(([t, cls]) => {
    if (!t) return;
    const s = document.createElement("span"); s.className = "tag" + (cls ? " " + cls : "");
    s.textContent = t; tags.append(s);
  });
  const d = document.createElement("p");
  d.className = "desc"; d.textContent = p.d || "";
  const row = document.createElement("div");
  row.className = "row2";
  const fav = document.createElement("button");
  fav.className = "chip warm";
  fav.setAttribute("aria-pressed", String(picks.has(p.id)));
  fav.textContent = picks.has(p.id) ? "♥ 담김" : "♥ 담기";
  fav.addEventListener("click", () => {
    picks.has(p.id) ? picks.delete(p.id) : picks.add(p.id);
    store.set(picks);
    fav.setAttribute("aria-pressed", String(picks.has(p.id)));
    fav.textContent = picks.has(p.id) ? "♥ 담김" : "♥ 담기";
    drawDots();
  });
  const go = document.createElement("a");
  go.className = "go"; go.href = p.u; go.target = "_blank"; go.rel = "noopener";
  go.textContent = "구글 지도에서 열기";
  row.append(fav, go);
  mapinfo.append(h, ja, tags, d, row);
}

svg.addEventListener("click", closePop);          // 바다나 섬의 빈 곳을 누르면 닫힌다
window.addEventListener("resize", closePop);      // 크기가 바뀌면 위치가 틀어지므로 접는다
document.addEventListener("keydown", e => { if (e.key === "Escape") closePop(); });

function drawDots(){
  if (!dotLayer) return;
  closePop();
  const list = PLACES.filter(match);
  const withLL = list.filter(p => p.ll);
  dotLayer.replaceChildren();
  withLL.forEach(p => {
    const [bx, by] = project(p.ll[0], p.ll[1]);
    const [jx, jy] = jitter(p.id);
    const x = bx + jx, y = by + jy;
    const g = el("g", {});
    const circ = el("circle", { class: "dot" + (picks.has(p.id) ? " pick" : ""), cx: x, cy: y, r: 6 });
    g.append(circ);
    const hit = el("circle", { class: "hit", cx: x, cy: y, r: 14 });
    hit.addEventListener("click", e => {
      e.stopPropagation();
      showPop(p, x, y, circ);
      showInfo(p);
    });
    g.append(hit);
    const title = el("title", {});
    title.textContent = p.n;
    g.append(title);
    dotLayer.append(g);
  });
  const no = list.length - withLL.length;
  mapnote.textContent = `지도에 ${withLL.length}곳 표시`
    + (no ? ` · 좌표를 못 찾은 ${no}곳은 목록 탭에서 볼 것` : "")
    + " · 점 위치는 동네 단위 근사값이다";
}

/* ---- 일정 ---- */
function buildItin(){
  const days = document.getElementById("days");
  if (days.childElementCount) return;
  ITIN.forEach(d => {
    const c = document.createElement("article");
    c.className = "day";

    const hd = document.createElement("div");
    hd.className = "hd";
    const dt = document.createElement("span"); dt.className = "dt"; dt.textContent = d.d;
    const wd = document.createElement("span"); wd.className = "wd"; wd.textContent = d.w + "요일";
    const base = document.createElement("span"); base.className = "base";
    base.textContent = (d.car ? "🚗 " : "🚶 ") + d.base;
    hd.append(dt, wd, base);

    const who = document.createElement("p"); who.className = "who"; who.textContent = d.who;

    const tl = document.createElement("ul"); tl.className = "tl";
    d.fix.forEach(([t, what]) => {
      const li = document.createElement("li");
      const b = document.createElement("b"); b.textContent = t;
      const s = document.createElement("span"); s.textContent = what;
      li.append(b, s); tl.append(li);
    });

    c.append(hd, who, tl);

    if (d.warn){
      const w = document.createElement("div"); w.className = "warnbox";
      const t = document.createElement("b"); t.textContent = "확인할 것";
      w.append(t, document.createTextNode(d.warn));
      c.append(w);
    }
    if (d.tip){
      const t = document.createElement("p"); t.className = "tipbox"; t.textContent = d.tip;
      c.append(t);
    }

    const go = document.createElement("button");
    go.className = "go";
    const n = PLACES.filter(p => p.a === d.pick.area).length;
    go.textContent = `${d.pick.area} 후보 ${n}곳 보기`;
    go.addEventListener("click", () => {
      state.area.clear(); state.area.add(d.pick.area);
      state.cat.clear(); state.aud.clear(); state.favOnly = false;
      state.q = ""; document.getElementById("q").value = "";
      document.querySelectorAll(".bar .chip").forEach(b => b.setAttribute("aria-pressed","false"));
      [...areaRow.querySelectorAll(".chip")]
        .find(b => b.textContent === d.pick.area)?.setAttribute("aria-pressed","true");
      setTab("list");
      render();
      window.scrollTo({ top: 0 });
    });
    c.append(go);
    days.append(c);
  });
}

/* ---- 쿠폰·축제 ---- */
function row(label, text, cls){
  const p = document.createElement("p");
  p.className = "kv" + (cls ? " " + cls : "");
  const b = document.createElement("b"); b.textContent = label;
  const s = document.createElement("span"); s.textContent = text;
  p.append(b, s);
  return p;
}
function linkBtn(url, label){
  const a = document.createElement("a");
  a.className = "go"; a.href = url; a.target = "_blank"; a.rel = "noopener";
  a.textContent = label;
  return a;
}

function festCard(f){
  const c = document.createElement("article");
  c.className = "day" + (f.go ? "" : " dim");
  const hd = document.createElement("div");
  hd.className = "hd";
  const b = document.createElement("span");
  b.className = "badge" + (f.go ? " hot" : ""); b.textContent = f.d;
  const t = document.createElement("span");
  t.className = "dt"; t.style.fontSize = "19px"; t.textContent = f.title;
  hd.append(b, t);
  c.append(hd);
  c.append(row("언제", f.when), row("어디", f.where), row("요금", f.fee));
  const why = document.createElement("p");
  why.className = "desc"; why.textContent = f.why;
  c.append(why);
  if (f.note){
    const n = document.createElement("p");
    n.className = f.go ? "tipbox" : "warnbox";
    n.textContent = f.note;
    c.append(n);
  }
  if (f.url) c.append(linkBtn(f.url, "공식 안내 열기"));
  return c;
}

function dealCard(d){
  const c = document.createElement("article");
  c.className = "day" + (d.cat === "안 됨" ? " dim" : "");
  const hd = document.createElement("div");
  hd.className = "hd";
  const b = document.createElement("span");
  b.className = "badge" + (d.hot ? " hot" : ""); b.textContent = d.cat;
  const t = document.createElement("span");
  t.className = "dt"; t.style.fontSize = "18px"; t.textContent = d.title;
  hd.append(b, t);
  c.append(hd);
  if (d.gain){
    const g = document.createElement("p");
    g.className = "gain"; g.textContent = d.gain;
    c.append(g);
  }
  if (d.where) c.append(row("어디", d.where));
  if (d.how){
    const h = document.createElement("p");
    h.className = "desc"; h.textContent = d.how;
    c.append(h);
  }
  if (d.warn){
    const w = document.createElement("p");
    w.className = "tipbox"; w.textContent = d.warn;
    c.append(w);
  }
  if (d.url) c.append(linkBtn(d.url, "링크 열기"));
  return c;
}

function buildDeals(){
  const go = document.getElementById("festGo");
  if (go.childElementCount) return;
  go.append(...FEST.filter(f => f.go).map(festCard));
  document.getElementById("festNo").append(...FEST.filter(f => !f.go).map(festCard));
  document.getElementById("deals").append(...DEALS.map(dealCard));
}

function buildInfo(){
  const pane = document.getElementById("infoPane");
  if (pane.childElementCount) return;
  INFO.forEach(sec => {
    const h = document.createElement("h2");
    h.className = "sec"; h.textContent = sec.sec;
    pane.append(h);
    if (sec.note){
      const n = document.createElement("p");
      n.className = "secnote"; n.textContent = sec.note;
      pane.append(n);
    }
    const grid = document.createElement("div");
    grid.className = "days";
    sec.items.forEach(it => {
      const c = document.createElement("article");
      c.className = "day info" + (it.dim ? " dim" : "") + (it.warn ? " danger" : "");
      const t = document.createElement("h3");
      t.className = "nm";
      if (it.hot){
        const s2 = document.createElement("span");
        s2.className = "star"; s2.textContent = "★ ";
        t.append(s2);
      }
      t.append(document.createTextNode(it.t));
      const d = document.createElement("p");
      d.className = "desc"; d.textContent = it.d;
      c.append(t, d);
      grid.append(c);
    });
    pane.append(grid);
  });
}

const listPane = document.getElementById("listPane");
const mapPane = document.getElementById("mapPane");
const itinPane = document.getElementById("itinPane");
const dealPane = document.getElementById("dealPane");
const infoPane = document.getElementById("infoPane");
const tabList = document.getElementById("tabList");
const tabMap = document.getElementById("tabMap");
const tabItin = document.getElementById("tabItin");
const tabDeal = document.getElementById("tabDeal");
const tabInfo = document.getElementById("tabInfo");
function setTab(which){
  const panes = { list: [listPane, tabList], map: [mapPane, tabMap],
                  itin: [itinPane, tabItin], deal: [dealPane, tabDeal],
                  info: [infoPane, tabInfo] };
  for (const k in panes){
    panes[k][0].hidden = k !== which;
    panes[k][1].setAttribute("aria-selected", String(k === which));
  }
  document.querySelector(".bar").classList.toggle("tabsonly", which === "itin" || which === "deal" || which === "info");
  if (which === "map"){
    if (!dotLayer) initMap();
    drawDots();
  }
  if (which === "itin") buildItin();
  if (which === "deal") buildDeals();
  if (which === "info") buildInfo();
}
tabList.addEventListener("click", () => setTab("list"));
tabMap.addEventListener("click", () => setTab("map"));
tabItin.addEventListener("click", () => setTab("itin"));
tabDeal.addEventListener("click", () => setTab("deal"));
tabInfo.addEventListener("click", () => setTab("info"));
if (!ITIN.length) tabItin.hidden = true;   // 공개용 빌드에는 일정이 없다

const dlg = document.getElementById("dlg");
document.getElementById("exportBtn").addEventListener("click", () => {
  const chosen = PLACES.filter(p => picks.has(p.id));
  const byArea = {};
  chosen.forEach(p => { (byArea[p.a] ||= []).push(p); });
  let out = `오키나와에서 가고 싶은 곳 ${chosen.length}곳\n`;
  for (const a of AREAS){
    if (!byArea[a]) continue;
    out += `\n[${a}]\n`;
    byArea[a].forEach(p => { out += `· ${p.n}${p.s ? " ("+p.s+")" : ""}\n  ${p.u}\n`; });
  }
  document.getElementById("dlgText").value = chosen.length ? out : "아직 고른 곳이 없다. 카드의 ♥ 를 눌러 담아보자.";
  dlg.showModal();
});
document.getElementById("copyBtn").addEventListener("click", async () => {
  const ta = document.getElementById("dlgText");
  ta.select();
  try { await navigator.clipboard.writeText(ta.value); document.getElementById("copyBtn").textContent = "복사됨"; }
  catch(e){ document.getElementById("copyBtn").textContent = "직접 복사하세요"; }
});
document.getElementById("closeBtn").addEventListener("click", () => {
  dlg.close();
  document.getElementById("copyBtn").textContent = "복사";
});

render();
</script>
